name: Daily Brief

on:
  # BACKSTOP ONLY -- do not rely on this for timing.
  #
  # GitHub's scheduled events are queued at low priority on free runners. On
  # this repo they fired between 4.5 and 9.5 hours late, every single weekday,
  # for at least twelve consecutive builds: a 12:07 UTC cron produced episodes
  # between 16:50 and 21:36 UTC. That is why the brief was always a day stale
  # by the time anyone listened in the morning.
  #
  # Real timing comes from an external scheduler calling the workflow_dispatch
  # API below. Manually dispatched runs are NOT subject to the schedule queue
  # and start within seconds. See "Timing" in the README.
  #
  # 14:47 UTC lands after the opening bell year-round, which plain UTC cron
  # otherwise can't manage across DST:
  #   winter (EST) -> 09:47 ET, 17 minutes after the open
  #   summer (EDT) -> 10:47 ET, 77 minutes after the open
  schedule:
    - cron: "47 14 * * 1-5"

  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if today's episode already exists"
        type: boolean
        default: false
      notify_only:
        description: "Send a test notification without building an episode"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Pull down the already-published site
        if: inputs.notify_only != true
        # Brings existing episodes into ./public so today's brief joins the
        # archive instead of replacing it. Fails harmlessly on the first run.
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: public

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        if: inputs.notify_only != true
        # The runner image no longer ships it.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build today's episode
        if: inputs.notify_only != true
        id: build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL:      ${{ vars.CLAUDE_MODEL      || 'claude-sonnet-5' }}
          TTS_VOICE:         ${{ vars.TTS_VOICE         || 'en-US-AndrewMultilingualNeural' }}
          SHOW_TITLE:        ${{ vars.SHOW_TITLE        || 'The Morning Brief' }}
          SHOW_AUTHOR:       ${{ vars.SHOW_AUTHOR       || 'Samuel Gibby' }}
          RETAIN_EPISODES:   ${{ vars.RETAIN_EPISODES   || '30' }}
          VAPID_PUBLIC_KEY:  ${{ vars.VAPID_PUBLIC_KEY }}
        # Skip unless this is a deliberate forced rebuild. A late backstop run
        # would otherwise replace the morning's brief with an evening one.
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python build.py
          else
            python build.py --skip-if-published
          fi

      - name: Publish to GitHub Pages
        if: inputs.notify_only != true
        run: |
          set -euo pipefail
          cd public
          if [ ! -f episodes.json ]; then
            echo "Nothing built (already published today). Skipping publish."
            exit 0
          fi
          rm -rf .git
          git init -q -b gh-pages
          git config user.name  "morning-brief-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Brief for $(date -u +%Y-%m-%d)"
          # Force-push a single fresh commit: the site keeps the last N
          # episodes and the repo never accumulates years of MP3 history.
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send the morning notification
        # After publishing, so the tap always lands on an episode that exists.
        # Silently skipped until alerts are enabled and the subscription stored.
        if: steps.build.outputs.built == 'true' || inputs.notify_only == true
        env:
          VAPID_PUBLIC_KEY:  ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_SUBJECT:     ${{ vars.VAPID_SUBJECT || 'mailto:noreply@example.com' }}
          # Passed as environment variables, NOT interpolated into the
          # command line. These strings are model-written from news
          # headlines: a title containing a quote breaks the argument, and
          # one containing $(...) or backticks would be substituted by
          # GitHub into the script and executed by the shell.
          BRIEF_DATE:   ${{ steps.build.outputs.date }}
          BRIEF_TITLE:  ${{ steps.build.outputs.title }}
          BRIEF_TEASER: ${{ steps.build.outputs.teaser }}
          BRIEF_IMAGE:  ${{ steps.build.outputs.image }}
        run: |
          if [ "${{ inputs.notify_only }}" = "true" ]; then
            python notify.py --date "$(date -u +%Y-%m-%d)" \
              --title "Test notification" \
              --body "If you can see this, push notifications are working."
          else
            python notify.py \
              --date "$BRIEF_DATE" \
              --title "$BRIEF_TITLE" \
              --body "$BRIEF_TEASER" \
              --image "$BRIEF_IMAGE"
          fi

      - name: Summary
        if: always()
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          {
            echo "### Morning Brief"
            echo ""
            echo "- Triggered by: \`${{ github.event_name }}\`"
            echo "- Site: https://${OWNER,,}.github.io/${NAME}/"
            echo "- Feed: https://${OWNER,,}.github.io/${NAME}/feed.xml"
          } >> "$GITHUB_STEP_SUMMARY"
