<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>The Morning Brief</title>
<meta name="description" content="A daily market brief.">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brief">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090b;
    --panel:rgba(255,255,255,.028);
    --panel-hi:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.07);
    --line-hi:rgba(255,255,255,.12);
    --text:#f4f5f7;
    --muted:#8a8f98;
    --dim:#5c626c;
    --accent:#7c6cf6;
    --accent-2:#4b9dfb;
    --ring:rgba(124,108,246,.45);
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --ease:cubic-bezier(.22,.8,.3,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.55;letter-spacing:-.011em;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overscroll-behavior-y:none;
    padding:calc(var(--safe-t) + 22px) 20px calc(var(--safe-b) + 56px);
    max-width:660px;margin:0 auto;position:relative;min-height:100vh;
  }
  /* ambient glow — the one piece of colour in the whole page */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(760px 420px at 50% -8%, rgba(124,108,246,.17), transparent 62%),
      radial-gradient(520px 320px at 88% 4%, rgba(75,157,251,.10), transparent 60%);
  }
  body>*{position:relative;z-index:1}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;
    letter-spacing:inherit}
  a{color:inherit}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:11px;margin:0 2px 26px}
  .mark{width:26px;height:26px;border-radius:8px;flex:none;position:relative;
    background:linear-gradient(145deg,var(--accent),var(--accent-2));
    box-shadow:0 2px 14px -2px rgba(124,108,246,.6)}
  .mark::after{content:"";position:absolute;inset:0;border-radius:8px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.32)}
  .wordmark{font-size:14.5px;font-weight:600;letter-spacing:-.015em}
  .eq{display:flex;align-items:flex-end;gap:2.5px;height:13px;margin-left:auto;
    opacity:0;transition:opacity .3s var(--ease)}
  .eq.on{opacity:1}
  .eq i{width:2.5px;border-radius:2px;background:var(--accent);height:4px;
    animation:bounce 1s infinite ease-in-out}
  .eq i:nth-child(2){animation-delay:.18s;background:var(--accent-2)}
  .eq i:nth-child(3){animation-delay:.36s}
  .eq i:nth-child(4){animation-delay:.54s;background:var(--accent-2)}
  @keyframes bounce{0%,100%{height:3px;opacity:.55}50%{height:13px;opacity:1}}
  @media (prefers-reduced-motion:reduce){.eq i{animation:none;height:7px}}

  /* ---------- hero card ---------- */
  .card{
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
    border:1px solid var(--line);border-radius:20px;
    padding:26px 24px 20px;margin-bottom:34px;
    backdrop-filter:blur(26px) saturate(150%);
    -webkit-backdrop-filter:blur(26px) saturate(150%);
    box-shadow:0 1px 0 rgba(255,255,255,.055) inset, 0 24px 60px -28px rgba(0,0,0,.95);
  }
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;
    font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);margin-bottom:14px}
  .eyebrow .pip{width:5px;height:5px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 9px var(--accent)}
  h1.title{font-size:28px;line-height:1.16;font-weight:650;letter-spacing:-.032em;
    margin:0 0 11px}
  .teaser{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 18px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
  .tag{font-size:11px;font-weight:500;letter-spacing:.03em;color:var(--muted);
    background:rgba(255,255,255,.035);border:1px solid var(--line);
    border-radius:7px;padding:4px 9px}

  /* ---------- transport ---------- */
  .transport{display:flex;align-items:center;justify-content:center;gap:26px;
    margin:6px 0 20px}
  .skip{position:relative;width:48px;height:48px;display:grid;place-items:center;
    color:var(--muted);border-radius:12px;
    transition:color .18s var(--ease),background .18s var(--ease)}
  .skip:hover{color:var(--text);background:rgba(255,255,255,.05)}
  .skip:active{transform:scale(.93)}
  .skip svg{display:block}
  .skip span{position:absolute;inset:0;display:grid;place-items:center;
    font-size:9px;font-weight:700;letter-spacing:0;padding-top:2px}
  .play{width:62px;height:62px;border-radius:50%;flex:none;display:grid;
    place-items:center;background:var(--text);color:#0b0c0f;
    box-shadow:0 10px 30px -10px rgba(255,255,255,.4),
               0 0 0 0 var(--ring);
    transition:transform .16s var(--ease),box-shadow .3s var(--ease)}
  .play:hover{transform:scale(1.045)}
  .play:active{transform:scale(.95)}
  .play.playing{box-shadow:0 10px 30px -12px rgba(124,108,246,.75),
                           0 0 0 7px rgba(124,108,246,.11)}
  .play svg{width:23px;height:23px;margin-left:1px}
  .play.playing svg{margin-left:0}

  /* ---------- scrubber ---------- */
  .scrub{width:100%;appearance:none;-webkit-appearance:none;height:22px;
    background:none;display:block;cursor:pointer}
  .scrub::-webkit-slider-runnable-track{height:4px;border-radius:99px;
    background:linear-gradient(90deg,var(--accent) var(--pct,0%),
      rgba(255,255,255,.1) var(--pct,0%))}
  .scrub::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
    border-radius:50%;background:#fff;margin-top:-4px;
    box-shadow:0 1px 6px rgba(0,0,0,.6);
    transition:transform .16s var(--ease)}
  .scrub:active::-webkit-slider-thumb{transform:scale(1.3)}
  .scrub::-moz-range-track{height:4px;border-radius:99px;background:rgba(255,255,255,.1)}
  .scrub::-moz-range-progress{height:4px;border-radius:99px;background:var(--accent)}
  .scrub::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
  .times{display:flex;justify-content:space-between;font-size:12px;
    font-variant-numeric:tabular-nums;color:var(--dim);margin-top:-1px;
    letter-spacing:0}

  /* ---------- actions ---------- */
  .actions{display:flex;justify-content:space-between;align-items:center;gap:8px;
    margin-top:18px;padding-top:17px;border-top:1px solid var(--line)}
  .pill-group{display:flex;gap:7px}
  .pill{font-size:13px;font-weight:500;color:var(--muted);padding:7px 13px;
    border:1px solid var(--line);border-radius:9px;
    transition:all .18s var(--ease)}
  .pill:hover{color:var(--text);border-color:var(--line-hi);
    background:rgba(255,255,255,.04)}
  .pill:active{transform:scale(.97)}
  .pill.on{color:var(--text);border-color:rgba(124,108,246,.5);
    background:rgba(124,108,246,.13)}

  /* ---------- panels ---------- */
  .panel{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
  .panel.open{display:block;animation:fade .28s var(--ease)}
  @keyframes fade{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
  #transcript{color:#c3c8d1;font-size:15.5px;line-height:1.78;white-space:pre-wrap;
    letter-spacing:-.005em}
  .src{display:block;padding:13px 0;border-bottom:1px solid var(--line);
    text-decoration:none;transition:opacity .18s var(--ease)}
  .src:hover{opacity:.72}
  .src:last-of-type{border-bottom:0}
  .src-name{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;
    text-transform:uppercase;color:var(--accent);margin-bottom:5px}
  .src-title{display:block;font-size:14.5px;line-height:1.45;color:#c3c8d1}
  .src-title::after{content:" ↗";color:var(--dim);font-size:11px}
  .src-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
    font-size:12px;color:var(--dim);line-height:1.7}

  /* ---------- archive ---------- */
  .section-label{font-size:11px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--dim);margin:0 2px 10px}
  .ep{display:flex;gap:14px;align-items:baseline;width:100%;text-align:left;
    padding:14px 12px;border-radius:12px;border:1px solid transparent;
    transition:all .18s var(--ease)}
  .ep:hover{background:rgba(255,255,255,.035);border-color:var(--line)}
  .ep:active{transform:scale(.995)}
  .ep.current{background:rgba(124,108,246,.1);border-color:rgba(124,108,246,.26)}
  .ep-date{font-size:12px;font-variant-numeric:tabular-nums;color:var(--dim);
    flex:none;width:46px;letter-spacing:0}
  .ep.current .ep-date{color:var(--accent)}
  .ep-title{flex:1;font-size:14.5px;font-weight:450;line-height:1.45}
  .ep-len{font-size:12px;color:var(--dim);flex:none;font-variant-numeric:tabular-nums}

  footer{margin-top:38px;text-align:center;color:var(--dim);font-size:12.5px;
    line-height:1.95}
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
  .state{text-align:center;color:var(--muted);padding:70px 20px;font-size:15px}
  .kbd{display:none}
  @media (min-width:700px){.kbd{display:inline}}
</style>
</head>
<body>

<header>
  <div class="mark"></div>
  <span class="wordmark" id="showTitle">The Morning Brief</span>
  <div class="eq" id="eq"><i></i><i></i><i></i><i></i></div>
</header>

<div id="app"><div class="state">Loading…</div></div>

<footer>
  <span id="stamp"></span><br>
  <a id="feedLink" href="feed.xml">Subscribe in a podcast app →</a>
</footer>

<audio id="audio" preload="metadata"></audio>

<script>
(function(){
  "use strict";

  var audio = document.getElementById('audio');
  var app   = document.getElementById('app');
  var eq    = document.getElementById('eq');
  var data = null, idx = 0, speed = 1, openPanel = null;
  var SPEEDS = [1, 1.25, 1.5, 1.75, 2];

  // Storage is best-effort: if the browser blocks it we just lose resume.
  var store = {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };

  function fmt(s){
    s = Math.max(0, Math.floor(s || 0));
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function shortDate(iso){
    var p = iso.split('-');
    return p[1].replace(/^0/,'') + '/' + p[2];
  }
  function longDate(iso){
    var p = iso.split('-').map(Number);
    return new Date(p[0], p[1]-1, p[2]).toLocaleDateString(undefined,
      { weekday:'long', month:'long', day:'numeric' });
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }

  var I_PLAY  = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a1 1 0 0 0 1.54.84l10.5-6.8a1 1 0 0 0 0-1.68l-10.5-6.8A1 1 0 0 0 8 5.2z"/></svg>';
  var I_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5h3.6v15H7zM13.4 4.5H17v15h-3.6z"/></svg>';
  var I_BACK  = '<svg viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span>15</span>';
  var I_FWD   = '<svg viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg><span>30</span>';

  function sourcesHtml(ep){
    var list = (ep.sources || []).map(function(s){
      return '<a class="src" href="' + esc(s.link) + '" target="_blank" rel="noopener noreferrer">' +
               '<span class="src-name">' + esc(s.source) + '</span>' +
               '<span class="src-title">' + esc(s.title) + '</span>' +
             '</a>';
    }).join('');
    return list + '<div class="src-foot">Reporting from the outlets above. ' +
      'Index, sector, commodity and crypto levels from Yahoo Finance; ' +
      'Treasury yields from the US Treasury daily curve; sector performance ' +
      'uses the SPDR sector ETFs.</div>';
  }

  function render(){
    var ep = data.episodes[idx];
    var hasSources = !!(ep.sources && ep.sources.length);

    app.innerHTML =
      '<div class="card">' +
        '<div class="eyebrow"><span class="pip"></span>' + esc(longDate(ep.date)) + '</div>' +
        '<h1 class="title">' + esc(ep.title) + '</h1>' +
        (ep.teaser ? '<p class="teaser">' + esc(ep.teaser) + '</p>' : '') +
        (ep.topics && ep.topics.length
          ? '<div class="tags">' + ep.topics.map(function(t){
              return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>'
          : '') +
        '<div class="transport">' +
          '<button class="skip" id="back" aria-label="Back 15 seconds">' + I_BACK + '</button>' +
          '<button class="play" id="play" aria-label="Play">' + I_PLAY + '</button>' +
          '<button class="skip" id="fwd" aria-label="Forward 30 seconds">' + I_FWD + '</button>' +
        '</div>' +
        '<input class="scrub" id="scrub" type="range" min="0" max="1000" value="0" aria-label="Seek">' +
        '<div class="times"><span id="cur">0:00</span><span id="dur">' + fmt(ep.duration) + '</span></div>' +
        '<div class="actions">' +
          '<button class="pill" id="speed">1&times;</button>' +
          '<div class="pill-group">' +
            (hasSources ? '<button class="pill" id="sbtn">Sources</button>' : '') +
            '<button class="pill" id="tbtn">Transcript</button>' +
          '</div>' +
        '</div>' +
        '<div class="panel" id="sources">' + sourcesHtml(ep) + '</div>' +
        '<div class="panel" id="transcript"></div>' +
      '</div>' +
      (data.episodes.length > 1
        ? '<div class="section-label">Archive</div><div id="archive"></div>' : '');

    if (data.episodes.length > 1) {
      document.getElementById('archive').innerHTML = data.episodes.map(function(e, i){
        return '<button class="ep' + (i === idx ? ' current' : '') + '" data-i="' + i + '">' +
                 '<span class="ep-date">' + shortDate(e.date) + '</span>' +
                 '<span class="ep-title">' + esc(e.title) + '</span>' +
                 '<span class="ep-len">' + fmt(e.duration) + '</span>' +
               '</button>';
      }).join('');
      document.getElementById('archive').addEventListener('click', function(ev){
        var btn = ev.target.closest('.ep');
        if (btn) select(Number(btn.dataset.i), true);
      });
    }
    wire();
    syncPlay();
  }

  function setPanel(name){
    openPanel = (openPanel === name) ? null : name;
    [['sources','sbtn'], ['transcript','tbtn']].forEach(function(pair){
      var box = document.getElementById(pair[0]);
      var btn = document.getElementById(pair[1]);
      var on = openPanel === pair[0];
      if (box) box.classList.toggle('open', on);
      if (btn) btn.classList.toggle('on', on);
    });
    if (openPanel === 'transcript') {
      var box = document.getElementById('transcript');
      if (box && !box.textContent) loadTranscript(box);
    }
  }

  function wire(){
    var play = document.getElementById('play');
    play.onclick = function(){ audio.paused ? audio.play() : audio.pause(); };
    document.getElementById('back').onclick = function(){ audio.currentTime -= 15; };
    document.getElementById('fwd').onclick  = function(){ audio.currentTime += 30; };

    var sp = document.getElementById('speed');
    sp.innerHTML = speed + '&times;';
    sp.classList.toggle('on', speed !== 1);
    sp.onclick = function(){
      speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
      audio.playbackRate = speed;
      store.set('speed', speed);
      sp.innerHTML = speed + '&times;';
      sp.classList.toggle('on', speed !== 1);
    };

    var sbtn = document.getElementById('sbtn');
    if (sbtn) sbtn.onclick = function(){ setPanel('sources'); };
    document.getElementById('tbtn').onclick = function(){ setPanel('transcript'); };

    document.getElementById('scrub').oninput = function(){
      if (audio.duration) audio.currentTime = audio.duration * (this.value / 1000);
    };
  }

  function loadTranscript(box){
    box.textContent = 'Loading…';
    fetch(data.episodes[idx].transcript)
      .then(function(r){ return r.text(); })
      .then(function(t){ box.textContent = t; })
      .catch(function(){ box.textContent = 'Transcript unavailable.'; });
  }

  function select(i, autoplay){
    idx = i;
    openPanel = null;
    var ep = data.episodes[idx];
    audio.src = ep.audio;
    audio.playbackRate = speed;
    store.set('last', ep.date);

    var saved = Number(store.get('pos:' + ep.date) || 0);
    if (saved > 5 && (!ep.duration || saved < ep.duration - 10)) audio.currentTime = saved;

    render();
    setMediaSession(ep);
    if (autoplay) audio.play().catch(function(){});
  }

  function setMediaSession(ep){
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: ep.title,
      artist: data.show || 'The Morning Brief',
      album: longDate(ep.date),
      artwork: [
        { src:'icons/icon-192.png', sizes:'192x192', type:'image/png' },
        { src:'icons/icon-512.png', sizes:'512x512', type:'image/png' }
      ]
    });
    var acts = {
      play:          function(){ audio.play(); },
      pause:         function(){ audio.pause(); },
      seekbackward:  function(){ audio.currentTime -= 15; },
      seekforward:   function(){ audio.currentTime += 30; },
      previoustrack: function(){ if (idx < data.episodes.length - 1) select(idx + 1, true); },
      nexttrack:     function(){ if (idx > 0) select(idx - 1, true); }
    };
    Object.keys(acts).forEach(function(k){
      try { navigator.mediaSession.setActionHandler(k, acts[k]); } catch(e){}
    });
  }

  function syncPlay(){
    var play = document.getElementById('play');
    if (!play) return;
    var playing = !audio.paused;
    play.innerHTML = playing ? I_PAUSE : I_PLAY;
    play.classList.toggle('playing', playing);
    play.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    eq.classList.toggle('on', playing);
  }

  audio.addEventListener('timeupdate', function(){
    var cur = document.getElementById('cur'), scrub = document.getElementById('scrub');
    if (!cur || !scrub) return;
    cur.textContent = fmt(audio.currentTime);
    if (audio.duration) {
      var pct = audio.currentTime / audio.duration * 1000;
      scrub.value = pct;
      scrub.style.setProperty('--pct', (pct / 10) + '%');
    }
    if (Math.floor(audio.currentTime) % 5 === 0) {
      store.set('pos:' + data.episodes[idx].date, Math.floor(audio.currentTime));
    }
  });
  audio.addEventListener('loadedmetadata', function(){
    var dur = document.getElementById('dur');
    if (dur && isFinite(audio.duration)) dur.textContent = fmt(audio.duration);
  });
  audio.addEventListener('play', syncPlay);
  audio.addEventListener('pause', syncPlay);
  audio.addEventListener('ended', function(){
    store.set('pos:' + data.episodes[idx].date, 0);
    syncPlay();
  });

  document.addEventListener('keydown', function(e){
    if (!data || /input|textarea/i.test((e.target.tagName || ''))) return;
    if (e.code === 'Space'){ e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
    else if (e.code === 'ArrowLeft')  audio.currentTime -= 15;
    else if (e.code === 'ArrowRight') audio.currentTime += 30;
  });

  var savedSpeed = Number(store.get('speed') || 1);
  if (SPEEDS.indexOf(savedSpeed) !== -1) speed = savedSpeed;

  fetch('episodes.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      data = d;
      if (!data.episodes || !data.episodes.length) throw new Error('empty');
      var name = data.show || 'The Morning Brief';
      document.getElementById('showTitle').textContent = name;
      document.title = name;
      document.getElementById('stamp').textContent =
        'Updated ' + new Date(data.updated).toLocaleString(undefined,
          { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
      select(0, false);
    })
    .catch(function(){
      app.innerHTML = '<div class="state">No episodes yet.<br>' +
        'The first one lands after the workflow runs.</div>';
    });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
