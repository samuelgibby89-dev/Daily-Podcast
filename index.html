<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>The Morning Brief</title>
<meta name="description" content="A daily brief you build yourself.">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brief">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090b; --line:rgba(255,255,255,.07); --line-hi:rgba(255,255,255,.13);
    --text:#f4f5f7; --muted:#8a8f98; --dim:#5c626c;
    --accent:#7c6cf6; --accent-2:#4b9dfb;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --ease:cubic-bezier(.22,.8,.3,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg);scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.55;letter-spacing:-.011em;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;-webkit-overflow-scrolling:touch;
  }
  #glow{position:fixed;inset:0 0 auto 0;height:70vh;pointer-events:none;z-index:0;
    background:radial-gradient(120% 70% at 50% 0%, var(--tint,rgba(124,108,246,.22)), transparent 70%);
    transition:background .8s var(--ease)}
  .wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;
    padding:calc(var(--safe-t) + 16px) 20px calc(var(--safe-b) + 64px)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
  a{color:inherit}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .mark{width:22px;height:22px;border-radius:7px;flex:none;position:relative;
    background:linear-gradient(145deg,var(--accent),var(--accent-2))}
  .mark::after{content:"";position:absolute;inset:0;border-radius:7px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  .wordmark{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
  .iconbtn{width:34px;height:34px;display:grid;place-items:center;
    border-radius:10px;color:var(--dim);transition:all .18s var(--ease)}
  .iconbtn:hover{color:var(--text);background:rgba(255,255,255,.05)}
  .iconbtn.on{color:var(--accent)}
  .spacer{margin-left:auto}

  /* ---------- topic picker ---------- */
  .picker{animation:fade .35s var(--ease)}
  .picker h2{font-size:27px;line-height:1.18;font-weight:650;letter-spacing:-.035em;
    margin:12px 0 8px;text-wrap:balance}
  .picker .lede{color:var(--muted);font-size:14.5px;margin:0 0 22px;max-width:30em}
  .grid{display:grid;gap:10px;grid-template-columns:1fr}
  @media(min-width:460px){.grid{grid-template-columns:1fr 1fr}}
  .card{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;
    padding:15px 15px;border-radius:15px;border:1px solid var(--line);
    background:rgba(255,255,255,.018);position:relative;
    transition:border-color .18s var(--ease),background .18s var(--ease),transform .14s var(--ease)}
  .card:hover{border-color:var(--line-hi);background:rgba(255,255,255,.04)}
  .card:active{transform:scale(.985)}
  .card.sel{border-color:rgba(124,108,246,.55);background:rgba(124,108,246,.11)}
  .card.full:not(.sel){opacity:.42}
  .card-ico{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
    background:rgba(255,255,255,.055);color:var(--muted);transition:all .18s var(--ease)}
  .card.sel .card-ico{background:rgba(124,108,246,.2);color:var(--accent)}
  .card-ico svg{width:18px;height:18px}
  .card-main{flex:1;min-width:0}
  .card-label{display:block;font-size:15px;font-weight:550;letter-spacing:-.015em}
  .card-blurb{display:block;font-size:12.5px;color:var(--dim);line-height:1.45;margin-top:2px}
  .tick{position:absolute;top:13px;right:13px;width:18px;height:18px;border-radius:50%;
    border:1.5px solid var(--line-hi);display:grid;place-items:center;
    transition:all .18s var(--ease)}
  .card.sel .tick{background:var(--accent);border-color:var(--accent)}
  .tick svg{width:10px;height:10px;opacity:0;color:#fff}
  .card.sel .tick svg{opacity:1}
  .picker-foot{position:sticky;bottom:0;margin-top:18px;
    padding:14px 0 calc(var(--safe-b) + 14px);
    background:linear-gradient(180deg,transparent,var(--bg) 34%)}
  .cta{width:100%;padding:14px;border-radius:13px;font-size:15px;font-weight:600;
    background:var(--text);color:#0b0c0f;transition:all .18s var(--ease)}
  .cta[disabled]{opacity:.3;cursor:default}
  .cta:not([disabled]):active{transform:scale(.985)}
  .picker-note{text-align:center;font-size:12px;color:var(--dim);margin-top:9px}

  /* ---------- now playing ---------- */
  .np{text-align:center;padding-top:4px}
  .art{position:relative;width:min(74vw,320px);aspect-ratio:1;margin:0 auto 26px;
    border-radius:18px;overflow:hidden;background:#13151a;
    box-shadow:0 30px 70px -28px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.055) inset;
    transform-origin:center top;will-change:transform,opacity}
  .art img{width:100%;height:100%;object-fit:cover;display:block;
    opacity:0;transition:opacity .5s var(--ease)}
  .art img.loaded{opacity:1}
  .art::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,transparent 58%,rgba(0,0,0,.38))}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent);margin-bottom:10px}
  h1.title{font-size:24px;line-height:1.22;font-weight:650;letter-spacing:-.03em;
    margin:0 0 8px;text-wrap:balance}
  .teaser{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0 auto 6px;max-width:34em}
  .credit{font-size:11px;color:var(--dim);margin:0 0 22px}
  .credit a{text-decoration:none;border-bottom:1px solid var(--line)}

  .scrub{width:100%;appearance:none;-webkit-appearance:none;height:24px;background:none;display:block}
  .scrub::-webkit-slider-runnable-track{height:4px;border-radius:99px;
    background:linear-gradient(90deg,var(--accent) var(--pct,0%),rgba(255,255,255,.1) var(--pct,0%))}
  .scrub::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#fff;margin-top:-4px;box-shadow:0 1px 6px rgba(0,0,0,.6);transition:transform .16s var(--ease)}
  .scrub:active::-webkit-slider-thumb{transform:scale(1.35)}
  .scrub::-moz-range-track{height:4px;border-radius:99px;background:rgba(255,255,255,.1)}
  .scrub::-moz-range-progress{height:4px;border-radius:99px;background:var(--accent)}
  .scrub::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
  .times{display:flex;justify-content:space-between;font-size:11.5px;
    font-variant-numeric:tabular-nums;color:var(--dim);margin-top:-2px;letter-spacing:0}

  .transport{display:flex;align-items:center;justify-content:center;gap:30px;margin:18px 0 20px}
  .skip{position:relative;width:52px;height:52px;display:grid;place-items:center;
    color:var(--muted);border-radius:14px;transition:all .18s var(--ease)}
  .skip:hover{color:var(--text);background:rgba(255,255,255,.05)}
  .skip:active{transform:scale(.92)}
  .skip span{position:absolute;inset:0;display:grid;place-items:center;
    font-size:9px;font-weight:700;padding-top:2px}
  .play{width:68px;height:68px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:var(--text);color:#0b0c0f;
    box-shadow:0 12px 34px -12px rgba(255,255,255,.42);
    transition:transform .16s var(--ease),box-shadow .35s var(--ease)}
  .play:hover{transform:scale(1.04)} .play:active{transform:scale(.95)}
  .play.playing{box-shadow:0 12px 34px -14px rgba(124,108,246,.8),0 0 0 8px rgba(124,108,246,.1)}
  .play svg{width:25px;height:25px;margin-left:2px}
  .play.playing svg{margin-left:0}

  .actions{display:flex;justify-content:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .pill{font-size:13px;font-weight:500;color:var(--muted);padding:7px 14px;
    border:1px solid var(--line);border-radius:10px;transition:all .18s var(--ease)}
  .pill:hover{color:var(--text);border-color:var(--line-hi);background:rgba(255,255,255,.04)}
  .pill:active{transform:scale(.97)}
  .pill.on{color:var(--text);border-color:rgba(124,108,246,.5);background:rgba(124,108,246,.13)}

  /* ---------- chapters ---------- */
  .chapters{margin:22px 0 0;text-align:left}
  .chap{display:flex;gap:12px;align-items:center;width:100%;text-align:left;
    padding:11px 12px;border-radius:12px;border:1px solid transparent;
    transition:all .18s var(--ease)}
  .chap:hover{background:rgba(255,255,255,.035);border-color:var(--line)}
  .chap.now{background:rgba(124,108,246,.1);border-color:rgba(124,108,246,.26)}
  .chap.done .chap-label{color:var(--dim)}
  .chap-ico{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
    background:rgba(255,255,255,.055);color:var(--muted)}
  .chap.now .chap-ico{background:rgba(124,108,246,.2);color:var(--accent)}
  .chap-ico svg{width:15px;height:15px}
  .chap-main{flex:1;min-width:0}
  .chap-label{display:block;font-size:13.5px;font-weight:550;letter-spacing:-.01em}
  .chap-title{display:block;font-size:12px;color:var(--dim);line-height:1.4;margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chap-dur{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none}

  /* ---------- sticky mini player ---------- */
  .mini{position:fixed;top:0;left:0;right:0;z-index:30;
    display:flex;align-items:center;gap:12px;
    padding:calc(var(--safe-t) + 9px) 18px 9px;
    background:rgba(10,11,14,.82);backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    border-bottom:1px solid var(--line);
    transform:translateY(-102%);transition:transform .32s var(--ease)}
  .mini.show{transform:translateY(0)}
  .mini-art{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none;background:#13151a}
  .mini-txt{flex:1;min-width:0}
  .mini-title{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;line-height:1.3}
  .mini-sub{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .mini-play{width:34px;height:34px;border-radius:50%;background:var(--text);color:#0b0c0f;
    display:grid;place-items:center;flex:none}
  .mini-play svg{width:14px;height:14px}
  .mini-bar{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);width:0%}

  /* ---------- panels ---------- */
  .panel{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--line);
    text-align:left}
  .panel.open{display:block;animation:fade .3s var(--ease)}
  @keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  #transcript{color:#c3c8d1;font-size:15.5px;line-height:1.78;white-space:pre-wrap}
  .seg-head{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    color:var(--accent);margin:20px 0 7px}
  .seg-head:first-child{margin-top:0}
  .src{display:block;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;
    transition:opacity .18s var(--ease)}
  .src:hover{opacity:.72} .src:last-of-type{border-bottom:0}
  .src-name{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;
    text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .src-title{display:block;font-size:14.5px;line-height:1.45;color:#c3c8d1}
  .src-title::after{content:" ↗";color:var(--dim);font-size:11px}
  .src-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
    font-size:12px;color:var(--dim);line-height:1.7}

  /* ---------- archive ---------- */
  .archive-head{display:flex;align-items:center;gap:10px;margin:40px 0 8px}
  .archive-head span{font-size:11px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--dim)}
  .archive-head i{flex:1;height:1px;background:var(--line)}
  .ep{display:flex;gap:13px;align-items:center;width:100%;text-align:left;
    padding:11px 10px;border-radius:13px;border:1px solid transparent;
    transition:all .18s var(--ease);opacity:0;transform:translateY(10px)}
  .ep.in{opacity:1;transform:none}
  .ep:hover{background:rgba(255,255,255,.035);border-color:var(--line)}
  .ep.current{background:rgba(124,108,246,.1);border-color:rgba(124,108,246,.26)}
  .ep-art{width:40px;height:40px;border-radius:9px;object-fit:cover;flex:none;background:#13151a}
  .ep-main{flex:1;min-width:0}
  .ep-title{display:block;font-size:14px;font-weight:450;line-height:1.35;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical}
  .ep-meta{display:block;font-size:11.5px;color:var(--dim);
    font-variant-numeric:tabular-nums;margin-top:2px}

  footer{margin-top:34px;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.95}
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
  .state{text-align:center;color:var(--muted);padding:80px 20px;font-size:15px}

  /* ---------- sheet ---------- */
  .sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;
    background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
  .sheet.open{display:flex;animation:fade .25s var(--ease)}
  .sheet-card{width:100%;max-width:620px;margin:0 auto;background:#101216;
    border-top-left-radius:20px;border-top-right-radius:20px;border:1px solid var(--line);
    padding:24px 22px calc(var(--safe-b) + 24px);animation:up .3s var(--ease)}
  @keyframes up{from{transform:translateY(24px)}to{transform:none}}
  .sheet h3{margin:0 0 8px;font-size:17px;font-weight:600;letter-spacing:-.02em}
  .sheet p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.6}
  .sheet textarea{width:100%;height:110px;background:#0a0b0e;color:#c3c8d1;
    border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:none}
  .sheet .row{display:flex;gap:8px;margin-top:14px}
  .btn{flex:1;padding:11px;border-radius:11px;font-size:14px;font-weight:550;text-align:center;
    border:1px solid var(--line);transition:all .18s var(--ease)}
  .btn.primary{background:var(--text);color:#0b0c0f;border-color:transparent}
  .btn:active{transform:scale(.98)}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .art,.mini,.ep,.card{transition:none!important;animation:none!important}
    .ep{opacity:1;transform:none}
  }
</style>
</head>
<body>

<div id="glow"></div>

<div class="mini" id="mini">
  <img class="mini-art" id="miniArt" alt="">
  <div class="mini-txt">
    <div class="mini-title" id="miniTitle"></div>
    <div class="mini-sub" id="miniSub">0:00</div>
  </div>
  <button class="mini-play" id="miniPlay" aria-label="Play"></button>
  <div class="mini-bar" id="miniBar"></div>
</div>

<div class="wrap">
  <div class="topbar">
    <div class="mark"></div>
    <span class="wordmark" id="showTitle">The Morning Brief</span>
    <button class="iconbtn spacer" id="edit" aria-label="Edit topics" title="Edit topics"
            style="display:none">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="currentColor"/>
        <circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="8" cy="18" r="2" fill="currentColor"/>
      </svg>
    </button>
    <button class="iconbtn" id="bell" aria-label="Morning alerts" title="Morning alerts">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>
  </div>

  <div id="app"><div class="state">Loading…</div></div>

  <footer>
    <span id="stamp"></span><br>
    <a id="feedLink" href="feed.xml">Subscribe in a podcast app →</a>
  </footer>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-card">
    <h3 id="sheetTitle">Morning alerts</h3>
    <p id="sheetBody"></p>
    <textarea id="sheetSub" readonly style="display:none"></textarea>
    <div class="row">
      <button class="btn" id="sheetClose">Close</button>
      <button class="btn primary" id="sheetAction">Enable</button>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
(function(){
  "use strict";

  var audio = document.getElementById('audio');
  var app   = document.getElementById('app');
  var mini  = document.getElementById('mini');

  var data = null;         // episodes.json
  var dayIdx = 0;          // which day is loaded
  var picked = [];         // chosen topic slugs
  var queue = [];          // the stitched playthrough: one entry per segment
  var qi = 0;              // index into queue
  var speed = 1, openPanel = null, vapidKey = null, seeking = false;
  var SPEEDS = [1, 1.25, 1.5, 1.75, 2];
  var MAXSEL = 4;

  var store = {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };

  // ---------- icons ----------
  var ICONS = {
    chart:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',
    chip:'<rect x="7" y="7" width="10" height="10" rx="2"/><path d="M4 10h3M4 14h3M17 10h3M17 14h3M10 4v3M14 4v3M10 17v3M14 17v3"/>',
    ball:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18M12 3a9 9 0 0 1 0 18M3.6 9h16.8M3.6 15h16.8"/>',
    briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/>',
    globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18"/>',
    flask:'<path d="M9 3h6M10 3v6L5 18a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 14h9"/>'
  };
  function icon(name){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" '+
           'stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||ICONS.chart)+'</svg>';
  }
  var I_PLAY  = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a1 1 0 0 0 1.54.84l10.5-6.8a1 1 0 0 0 0-1.68l-10.5-6.8A1 1 0 0 0 8 5.2z"/></svg>';
  var I_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5h3.6v15H7zM13.4 4.5H17v15h-3.6z"/></svg>';
  var I_BACK  = '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span>15</span>';
  var I_FWD   = '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg><span>30</span>';
  var I_TICK  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  // ---------- helpers ----------
  function fmt(s){
    s = Math.max(0, Math.floor(s || 0));
    var m = Math.floor(s/60), r = s%60;
    return m + ':' + (r<10?'0':'') + r;
  }
  function longDate(iso){
    var p = iso.split('-').map(Number);
    return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,
      {weekday:'long', month:'long', day:'numeric'});
  }
  function shortDate(iso){
    var p = iso.split('-').map(Number);
    return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,
      {month:'short', day:'numeric'});
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
  }
  function menu(){ return (data && data.menu) || []; }
  function segsFor(day){ return (day && day.segments) || {}; }

  // Topics on the menu that this day actually produced. A topic whose feeds
  // died is simply absent from that day rather than offered and broken.
  function availableOn(day){
    var segs = segsFor(day);
    return menu().filter(function(m){ return !!segs[m.slug]; });
  }

  function coverOf(seg){
    return (seg && seg.cover && seg.cover.url) ? seg.cover.url : 'icons/icon-512.png';
  }

  /* Build the playthrough.
     One topic picked  -> that topic's long cut, the full three minutes.
     Several picked    -> each topic's 45-second cut, in menu order, stitched.
     That rule is the whole product decision: breadth costs depth. */
  function buildQueue(){
    var day = data.episodes[dayIdx];
    var segs = segsFor(day);
    var live = picked.filter(function(s){ return !!segs[s]; });
    var solo = live.length === 1;
    queue = [];
    menu().forEach(function(m){
      if (live.indexOf(m.slug) === -1) return;
      var seg = segs[m.slug];
      var cut = solo ? (seg.long || seg.short) : (seg.short || seg.long);
      if (!cut || !cut.audio) return;
      queue.push({
        slug: m.slug, label: m.label, icon: m.icon, seg: seg, cut: cut,
        solo: solo, duration: cut.duration || 0
      });
    });
    qi = 0;
  }

  function totalDuration(){
    return queue.reduce(function(a,q){ return a + (q.duration||0); }, 0);
  }
  function elapsedBefore(i){
    var t = 0; for (var n=0; n<i; n++) t += queue[n].duration||0; return t;
  }
  function globalTime(){
    return elapsedBefore(qi) + (audio.currentTime || 0);
  }

  // The segment whose story leads: highest model-assigned weight. This is how
  // one cover gets chosen to represent a brief assembled from several topics.
  function leadSegment(){
    if (!queue.length) return null;
    return queue.reduce(function(a,b){
      return (b.seg.weight||0) > (a.seg.weight||0) ? b : a;
    }).seg;
  }

  // ---------- the picker ----------
  function renderPicker(){
    var day = data.episodes[dayIdx];
    var avail = availableOn(day);
    var sel = picked.slice();

    function cards(){
      return avail.map(function(m){
        var on = sel.indexOf(m.slug) !== -1;
        var full = sel.length >= MAXSEL && !on;
        return '<button class="card'+(on?' sel':'')+(full?' full':'')+'" data-slug="'+esc(m.slug)+'">'+
          '<span class="card-ico">'+icon(m.icon)+'</span>'+
          '<span class="card-main"><span class="card-label">'+esc(m.label)+'</span>'+
          '<span class="card-blurb">'+esc(m.blurb)+'</span></span>'+
          '<span class="tick">'+I_TICK+'</span></button>';
      }).join('');
    }
    function note(){
      if (!sel.length) return 'Pick up to ' + MAXSEL + '.';
      if (sel.length === 1) return 'One topic — you get the full three-minute version.';
      return sel.length + ' topics · about ' + Math.round(sel.length * 0.75) + ' minutes';
    }

    app.innerHTML =
      '<div class="picker">' +
        '<h2>What do you want to hear?</h2>' +
        '<p class="lede">Pick up to '+MAXSEL+' topics and we\'ll build you one continuous '+
        'briefing, never longer than three minutes. Choose just one and you get '+
        'the long version of it instead.</p>' +
        '<div class="grid" id="grid">'+cards()+'</div>' +
        '<div class="picker-foot">' +
          '<button class="cta" id="start"'+(sel.length?'':' disabled')+'>Start listening</button>' +
          '<div class="picker-note" id="note">'+esc(note())+'</div>' +
        '</div>' +
      '</div>';

    document.getElementById('grid').addEventListener('click', function(ev){
      var b = ev.target.closest('.card');
      if (!b) return;
      var slug = b.dataset.slug, at = sel.indexOf(slug);
      if (at !== -1) sel.splice(at,1);
      else if (sel.length < MAXSEL) sel.push(slug);
      else return;
      // Re-render just the cards and the footer, not the whole screen.
      document.getElementById('grid').innerHTML = cards();
      document.getElementById('note').textContent = note();
      document.getElementById('start').disabled = !sel.length;
    });

    document.getElementById('start').onclick = function(){
      if (!sel.length) return;
      picked = sel.slice();
      store.set('topics', JSON.stringify(picked));
      buildQueue();
      loadSegment(0, false);
      renderPlayer();
      window.scrollTo({top:0});
    };

    document.getElementById('edit').style.display = 'none';
    mini.classList.remove('show');
  }

  // ---------- the player ----------
  function renderPlayer(){
    var day = data.episodes[dayIdx];
    var lead = leadSegment();
    if (!lead) { renderPicker(); return; }

    var anySources = queue.some(function(q){
      return q.seg.sources && q.seg.sources.length; });

    app.innerHTML =
      '<div class="np">' +
        '<div class="art" id="art"><img id="artImg" alt="" src="'+esc(coverOf(lead))+'"></div>' +
        '<div class="eyebrow">'+esc(longDate(day.date))+'</div>' +
        '<h1 class="title">'+esc(lead.title)+'</h1>' +
        (lead.teaser ? '<p class="teaser">'+esc(lead.teaser)+'</p>' : '') +
        creditHtml(lead) +
        '<input class="scrub" id="scrub" type="range" min="0" max="1000" value="0" aria-label="Seek">' +
        '<div class="times"><span id="cur">0:00</span>'+
          '<span id="dur">'+fmt(totalDuration())+'</span></div>' +
        '<div class="transport">' +
          '<button class="skip" id="back" aria-label="Back 15 seconds">'+I_BACK+'</button>' +
          '<button class="play" id="play" aria-label="Play">'+I_PLAY+'</button>' +
          '<button class="skip" id="fwd" aria-label="Forward 30 seconds">'+I_FWD+'</button>' +
        '</div>' +
        '<div class="actions">' +
          '<button class="pill" id="speed">1&times;</button>' +
          (anySources ? '<button class="pill" id="sbtn">Sources</button>' : '') +
          '<button class="pill" id="tbtn">Transcript</button>' +
        '</div>' +
        '<div class="chapters" id="chapters"></div>' +
        '<div class="panel" id="sources">'+sourcesHtml()+'</div>' +
        '<div class="panel" id="transcript"></div>' +
      '</div>' +
      (data.episodes.length > 1
        ? '<div class="archive-head"><span>Earlier</span><i></i></div><div id="archive"></div>'
        : '');

    var img = document.getElementById('artImg');
    img.onload = function(){ this.classList.add('loaded'); tintFrom(this); };
    img.onerror = function(){ this.src = 'icons/icon-512.png'; };
    if (img.complete) img.onload();

    renderChapters();
    if (data.episodes.length > 1) buildArchive();
    wire();
    syncPlay();
    document.getElementById('edit').style.display = '';
    document.getElementById('miniArt').src = coverOf(lead);
  }

  function renderChapters(){
    var box = document.getElementById('chapters');
    if (!box) return;
    box.innerHTML = queue.map(function(q,i){
      var cls = i === qi ? ' now' : (i < qi ? ' done' : '');
      return '<button class="chap'+cls+'" data-i="'+i+'">'+
        '<span class="chap-ico">'+icon(q.icon)+'</span>'+
        '<span class="chap-main"><span class="chap-label">'+esc(q.label)+'</span>'+
        '<span class="chap-title">'+esc(q.seg.title)+'</span></span>'+
        '<span class="chap-dur">'+fmt(q.duration)+'</span></button>';
    }).join('');
    box.onclick = function(ev){
      var b = ev.target.closest('.chap');
      if (!b) return;
      var want = Number(b.dataset.i);
      var playing = !audio.paused;
      loadSegment(want, playing);
      renderChapters();
    };
  }

  function creditHtml(seg){
    var c = seg.cover;
    if (!c || c.type !== 'photo' || !c.credit) return '';
    var label = 'Cover: ' + esc(c.credit);
    return '<div class="credit">' + (c.link
      ? '<a href="'+esc(c.link)+'" target="_blank" rel="noopener noreferrer">'+label+'</a>'
      : label) + '</div>';
  }

  function sourcesHtml(){
    var out = queue.map(function(q){
      var list = (q.seg.sources||[]);
      if (!list.length) return '';
      return '<div class="seg-head">'+esc(q.label)+'</div>' + list.map(function(s){
        return '<a class="src" href="'+esc(s.link)+'" target="_blank" rel="noopener noreferrer">'+
                 '<span class="src-name">'+esc(s.source)+'</span>'+
                 '<span class="src-title">'+esc(s.title)+'</span></a>';
      }).join('');
    }).join('');
    return out + '<div class="src-foot">Reporting from the outlets above. '+
      'Market levels via Yahoo Finance; Treasury yields from the US Treasury '+
      'daily curve; sectors use the SPDR sector ETFs.</div>';
  }

  function buildArchive(){
    var box = document.getElementById('archive');
    box.innerHTML = data.episodes.map(function(e,i){
      var segs = segsFor(e);
      // Show each day by whichever of this listener's topics led it.
      var mine = picked.map(function(s){ return segs[s]; }).filter(Boolean);
      var pool = mine.length ? mine : Object.keys(segs).map(function(k){ return segs[k]; });
      if (!pool.length) return '';
      var lead = pool.reduce(function(a,b){
        return (b.weight||0) > (a.weight||0) ? b : a; });
      var secs = pool.reduce(function(a,s){
        var c = (mine.length === 1 ? (s.long||s.short) : (s.short||s.long));
        return a + ((c && c.duration) || 0); }, 0);
      return '<button class="ep'+(i===dayIdx?' current':'')+'" data-i="'+i+'">'+
        '<img class="ep-art" src="'+esc(coverOf(lead))+'" alt="" loading="lazy">'+
        '<span class="ep-main"><span class="ep-title">'+esc(lead.title)+'</span>'+
        '<span class="ep-meta">'+shortDate(e.date)+' · '+fmt(secs)+'</span></span>'+
      '</button>';
    }).join('');
    box.addEventListener('click', function(ev){
      var b = ev.target.closest('.ep');
      if (!b) return;
      dayIdx = Number(b.dataset.i);
      buildQueue();
      loadSegment(0, true);
      renderPlayer();
      window.scrollTo({top:0, behavior:'smooth'});
    });
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en, n){
        if (en.isIntersecting) {
          setTimeout(function(){ en.target.classList.add('in'); }, n * 45);
          io.unobserve(en.target);
        }
      });
    }, {rootMargin:'0px 0px -40px 0px'});
    [].forEach.call(box.children, function(c){ io.observe(c); });
  }

  function tintFrom(img){
    try {
      var c = document.createElement('canvas');
      c.width = c.height = 12;
      var x = c.getContext('2d', {willReadFrequently:true});
      x.drawImage(img, 0, 0, 12, 12);
      var d = x.getImageData(0,0,12,12).data, r=0,g=0,b=0,n=0;
      for (var i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; }
      r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
      var max = Math.max(r,g,b) || 1, boost = Math.min(2.1, 170/max);
      r=Math.min(255,Math.round(r*boost)); g=Math.min(255,Math.round(g*boost)); b=Math.min(255,Math.round(b*boost));
      document.getElementById('glow').style.setProperty('--tint','rgba('+r+','+g+','+b+',.26)');
    } catch(e){ /* cross-origin cover: keep the default violet wash */ }
  }

  function setPanel(name){
    openPanel = (openPanel === name) ? null : name;
    [['sources','sbtn'],['transcript','tbtn']].forEach(function(p){
      var box = document.getElementById(p[0]), btn = document.getElementById(p[1]);
      var on = openPanel === p[0];
      if (box) box.classList.toggle('open', on);
      if (btn) btn.classList.toggle('on', on);
    });
    if (openPanel === 'transcript') loadTranscripts();
  }

  function loadTranscripts(){
    var box = document.getElementById('transcript');
    if (!box || box.dataset.loaded === key()) return;
    box.dataset.loaded = key();
    box.textContent = 'Loading…';
    Promise.all(queue.map(function(q){
      var path = q.cut && q.cut.transcript;
      if (!path) return Promise.resolve({label:q.label, text:''});
      return fetch(path).then(function(r){ return r.ok ? r.text() : ''; })
        .then(function(t){ return {label:q.label, text:t}; })
        .catch(function(){ return {label:q.label, text:''}; });
    })).then(function(parts){
      box.innerHTML = parts.map(function(p){
        if (!p.text) return '';
        return '<div class="seg-head">'+esc(p.label)+'</div>'+esc(p.text);
      }).join('\n\n') || 'Transcript unavailable.';
    });
  }
  function key(){
    return data.episodes[dayIdx].date + '|' + queue.map(function(q){ return q.slug; }).join(',');
  }

  function wire(){
    document.getElementById('play').onclick = toggle;
    document.getElementById('back').onclick = function(){ seekGlobal(globalTime() - 15); };
    document.getElementById('fwd').onclick  = function(){ seekGlobal(globalTime() + 30); };

    var sp = document.getElementById('speed');
    sp.innerHTML = speed + '&times;';
    sp.classList.toggle('on', speed !== 1);
    sp.onclick = function(){
      speed = SPEEDS[(SPEEDS.indexOf(speed)+1) % SPEEDS.length];
      audio.playbackRate = speed;
      store.set('speed', speed);
      sp.innerHTML = speed + '&times;';
      sp.classList.toggle('on', speed !== 1);
    };
    var sbtn = document.getElementById('sbtn');
    if (sbtn) sbtn.onclick = function(){ setPanel('sources'); };
    document.getElementById('tbtn').onclick = function(){ setPanel('transcript'); };

    var scrub = document.getElementById('scrub');
    scrub.oninput  = function(){ seeking = true; };
    scrub.onchange = function(){
      seeking = false;
      seekGlobal(totalDuration() * (this.value/1000));
    };
  }

  function toggle(){ audio.paused ? audio.play().catch(function(){}) : audio.pause(); }

  /* Seek across the whole stitched brief, hopping segments as needed. */
  function seekGlobal(t){
    var total = totalDuration();
    t = Math.max(0, Math.min(total - 0.25, t));
    var acc = 0;
    for (var i=0; i<queue.length; i++){
      var d = queue[i].duration || 0;
      if (t < acc + d || i === queue.length - 1){
        var within = t - acc;
        if (i === qi){ audio.currentTime = within; }
        else { loadSegment(i, !audio.paused, within); }
        return;
      }
      acc += d;
    }
  }

  /* Load one segment into the single <audio> element.

     There is deliberately ONE element for the whole playthrough, with its src
     swapped between segments, rather than one element per segment. On iOS the
     permission to play audio is granted to an element by a user gesture; a
     freshly created element has no such permission, so a brief assembled from
     four files would stop dead after the first one. Swapping src on the
     element the listener actually pressed play on keeps that permission for
     the whole brief. */
  function loadSegment(i, autoplay, at){
    if (!queue.length) return;
    qi = Math.max(0, Math.min(queue.length - 1, i));
    var q = queue[qi];
    audio.src = q.cut.audio;
    audio.playbackRate = speed;
    if (at) {
      // Wait for metadata, or the seek is discarded by the element.
      audio.addEventListener('loadedmetadata', function once(){
        audio.removeEventListener('loadedmetadata', once);
        try { audio.currentTime = at; } catch(e){}
        paint();
      });
    } else {
      paint();
    }
    setMediaSession();
    renderChapters();
    document.getElementById('miniTitle').textContent =
      q.solo ? q.seg.title : (q.label + ' · ' + q.seg.title);
    if (autoplay) audio.play().catch(function(){});
  }

  function setMediaSession(){
    if (!('mediaSession' in navigator)) return;
    var day = data.episodes[dayIdx], q = queue[qi], lead = leadSegment();
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: q.solo ? q.seg.title : (q.label + ' — ' + q.seg.title),
        artist: data.show || 'The Morning Brief',
        album: longDate(day.date),
        artwork: [{ src: new URL(coverOf(lead), location.href).href,
                    sizes:'1024x1024', type:'image/png' }]
      });
    } catch(e){}
    var acts = {
      play: function(){ audio.play().catch(function(){}); },
      pause: function(){ audio.pause(); },
      seekbackward: function(){ seekGlobal(globalTime() - 15); },
      seekforward:  function(){ seekGlobal(globalTime() + 30); },
      previoustrack: function(){ if (qi > 0) loadSegment(qi-1, true); },
      nexttrack: function(){ if (qi < queue.length-1) loadSegment(qi+1, true); }
    };
    Object.keys(acts).forEach(function(k){
      try { navigator.mediaSession.setActionHandler(k, acts[k]); } catch(e){}
    });
  }

  function syncPlay(){
    var playing = !audio.paused;
    var p = document.getElementById('play');
    if (p){
      p.innerHTML = playing ? I_PAUSE : I_PLAY;
      p.classList.toggle('playing', playing);
      p.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    }
    var mp = document.getElementById('miniPlay');
    mp.innerHTML = playing ? I_PAUSE : I_PLAY;
    mp.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }

  // ---------- scroll ----------
  var ticking = false;
  function onScroll(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      var art = document.getElementById('art');
      var y = window.scrollY || 0;
      if (art){
        var t = Math.min(1, y / 260);
        art.style.transform = 'scale(' + (1 - t*0.14) + ') translateY(' + (-y*0.14) + 'px)';
        art.style.opacity = String(1 - t*0.55);
        mini.classList.toggle('show', y > 230);
      }
      ticking = false;
    });
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  document.getElementById('miniPlay').onclick = toggle;
  mini.onclick = function(ev){
    if (ev.target.closest('#miniPlay')) return;
    window.scrollTo({top:0, behavior:'smooth'});
  };

  // ---------- audio events ----------
  /* Paint the unified timeline. Called on timeupdate and immediately after a
     seek, because a listener who scrubs while paused gets no timeupdate and
     would otherwise see the clock stuck at the segment boundary. */
  function paint(){
    if (!queue.length) return;
    var g = globalTime(), total = totalDuration();
    var cur = document.getElementById('cur'), scrub = document.getElementById('scrub');
    if (cur) cur.textContent = fmt(g);
    var ms = document.getElementById('miniSub');
    if (ms) ms.textContent = fmt(g) + ' / ' + fmt(total);
    if (total && !seeking){
      var pct = g / total * 1000;
      if (scrub){ scrub.value = pct; scrub.style.setProperty('--pct', (pct/10)+'%'); }
      var bar = document.getElementById('miniBar');
      if (bar) bar.style.width = (pct/10)+'%';
    }
    return g;
  }

  audio.addEventListener('timeupdate', function(){
    var g = paint();
    if (g != null && Math.floor(g) % 5 === 0) store.set('pos:'+key(), Math.floor(g));
  });
  audio.addEventListener('seeked', paint);

  /* Advance to the next segment. This is what makes several files play as one
     brief, and it runs inside the ended handler so the element keeps the play
     permission the listener's original tap gave it. */
  audio.addEventListener('ended', function(){
    if (qi < queue.length - 1){
      loadSegment(qi + 1, true);
    } else {
      store.set('pos:'+key(), 0);
      syncPlay();
      renderChapters();
    }
  });

  audio.addEventListener('play', function(){ syncPlay(); renderChapters(); });
  audio.addEventListener('pause', syncPlay);

  document.addEventListener('keydown', function(e){
    if (!data || !queue.length || /input|textarea/i.test(e.target.tagName||'')) return;
    if (e.code === 'Space'){ e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft')  seekGlobal(globalTime() - 15);
    else if (e.code === 'ArrowRight') seekGlobal(globalTime() + 30);
  });

  document.getElementById('edit').onclick = function(){
    audio.pause();
    renderPicker();
    window.scrollTo({top:0});
  };

  // ---------- notifications ----------
  var sheet = document.getElementById('sheet');
  function openSheet(title, body, actionLabel, action, sub){
    document.getElementById('sheetTitle').textContent = title;
    document.getElementById('sheetBody').textContent = body;
    var ta = document.getElementById('sheetSub');
    ta.style.display = sub ? 'block' : 'none';
    if (sub) ta.value = sub;
    var btn = document.getElementById('sheetAction');
    btn.textContent = actionLabel;
    btn.style.display = action ? 'block' : 'none';
    btn.onclick = action || null;
    sheet.classList.add('open');
  }
  document.getElementById('sheetClose').onclick = function(){ sheet.classList.remove('open'); };
  sheet.onclick = function(e){ if (e.target === sheet) sheet.classList.remove('open'); };

  function b64ToU8(b64){
    var pad = '='.repeat((4 - b64.length % 4) % 4);
    var raw = atob((b64 + pad).replace(/-/g,'+').replace(/_/g,'/'));
    return Uint8Array.from([].map.call(raw, function(c){ return c.charCodeAt(0); }));
  }

  function bellState(){
    var b = document.getElementById('bell');
    if (!('Notification' in window) || !navigator.serviceWorker) return;
    navigator.serviceWorker.ready.then(function(reg){
      return reg.pushManager.getSubscription();
    }).then(function(sub){ b.classList.toggle('on', !!sub); }).catch(function(){});
  }

  document.getElementById('bell').onclick = function(){
    var standalone = window.matchMedia('(display-mode: standalone)').matches ||
                     window.navigator.standalone === true;
    if (!('Notification' in window) || !('PushManager' in window)) {
      return openSheet('Morning alerts',
        'This browser can’t do push notifications. On iPhone, add the app to your home screen from Safari and open it from there.',
        '', null);
    }
    if (!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)) {
      return openSheet('Add to home screen first',
        'iOS only allows notifications for installed web apps. Tap the share icon, choose Add to Home Screen, then open the app from your home screen and tap the bell again.',
        '', null);
    }
    if (!vapidKey) {
      return openSheet('Not configured yet',
        'The push key hasn’t been set on the server. Add VAPID_PUBLIC_KEY as a repository variable and run the workflow once.',
        '', null);
    }
    openSheet('Morning alerts',
      'Get a notification each weekday when the new brief is ready. Tapping it opens straight to that day.',
      'Enable', function(){
        Notification.requestPermission().then(function(perm){
          if (perm !== 'granted') {
            return openSheet('Notifications blocked',
              'Permission was denied. You can re-enable it in your device settings for this app.', '', null);
          }
          navigator.serviceWorker.ready.then(function(reg){
            return reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: b64ToU8(vapidKey)
            });
          }).then(function(sub){
            document.getElementById('bell').classList.add('on');
            openSheet('Almost there',
              'Copy the text below and save it as a repository secret named PUSH_SUBSCRIPTION. That’s a one-time step — after that the alerts just arrive.',
              'Copy', function(){
                var ta = document.getElementById('sheetSub');
                ta.select();
                navigator.clipboard.writeText(ta.value).then(function(){
                  document.getElementById('sheetAction').textContent = 'Copied';
                }).catch(function(){});
              }, JSON.stringify(sub));
          }).catch(function(err){
            openSheet('Couldn’t subscribe', String(err && err.message || err), '', null);
          });
        });
      });
  };

  // ---------- boot ----------
  var savedSpeed = Number(store.get('speed') || 1);
  if (SPEEDS.indexOf(savedSpeed) !== -1) speed = savedSpeed;

  fetch('push.json').then(function(r){ return r.ok ? r.json() : null; })
    .then(function(p){ if (p && p.vapidPublicKey) vapidKey = p.vapidPublicKey; })
    .catch(function(){});

  fetch('episodes.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      data = d;
      if (!data.episodes || !data.episodes.length) throw new Error('empty');

      // An old home-screen app may still be running a cached shell against a
      // newer index, or the reverse. Say so instead of rendering nothing.
      if (!data.menu || !data.episodes[0].segments) {
        app.innerHTML = '<div class="state">This app needs a refresh.<br>' +
          'Close it fully and reopen, or remove and re-add it to your home screen.</div>';
        return;
      }

      MAXSEL = data.maxSelection || 4;
      var name = data.show || 'The Morning Brief';
      document.getElementById('showTitle').textContent = name;
      document.title = name;
      document.getElementById('stamp').textContent =
        'Updated ' + new Date(data.updated).toLocaleString(undefined,
          {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});

      var params = new URLSearchParams(location.search);

      // ?episode=YYYY-MM-DD lets a notification open straight to its day
      var want = params.get('episode');
      var at = want ? data.episodes.findIndex(function(e){ return e.date === want; }) : -1;
      dayIdx = at >= 0 ? at : 0;

      // ?topics=a,b shares a mix; otherwise use what this device chose before
      var fromUrl = (params.get('topics')||'').split(',').filter(Boolean);
      var saved = [];
      try { saved = JSON.parse(store.get('topics') || '[]') || []; } catch(e){}
      var known = menu().map(function(m){ return m.slug; });
      picked = (fromUrl.length ? fromUrl : saved)
                 .filter(function(s){ return known.indexOf(s) !== -1; })
                 .slice(0, MAXSEL);

      bellState();

      if (!picked.length) { renderPicker(); return; }
      buildQueue();
      if (!queue.length) { renderPicker(); return; }
      loadSegment(0, false);
      var resume = Number(store.get('pos:'+key()) || 0);
      if (resume > 5 && resume < totalDuration() - 10) seekGlobal(resume);
      renderPlayer();
    })
    .catch(function(){
      app.innerHTML = '<div class="state">No episodes yet.<br>The first one lands after the workflow runs.</div>';
    });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
